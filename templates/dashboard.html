
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Notes App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="dashboard">
        <header class="top-bar">
            <div>
                <h1>My Notes</h1>
                <p>Welcome, {{ session['username'] }}!</p>
            </div>
            <a class="logout-button" href="{{ url_for('logout') }}">Logout</a>
        </header>

        <section class="add-note">
            <h2>Create a New Note</h2>

            <form method="POST" action="{{ url_for('add_note') }}">
                <input type="text" name="title" placeholder="Enter note title" required>
                <textarea name="content" placeholder="Write your note here..." required></textarea>
                <button type="submit">Add Note</button>
            </form>
        </section>

        <section class="notes-section">
            <h2>Your Saved Notes</h2>

            {% if notes %}
                <div class="notes-grid">
                    {% for note in notes %}
                        <div class="note-card">
                            <h3>{{ note['title'] }}</h3>
                            <p>{{ note['content'] }}</p>
                            <small>Created: {{ note['created_at'] }}</small>

                            <div class="note-actions">
                                <a class="edit-button" href="{{ url_for('edit_note', note_id=note['id']) }}">Edit</a>

                                <form method="POST" action="{{ url_for('delete_note', note_id=note['id']) }}">
                                    <button class="delete-button" type="submit">Delete</button>
                                </form>
                            </div>
                        </div>
                    {% endfor %}
                </div>
            {% else %}
                <p class="empty-message">You haven't created any notes yet.</p>
            {% endif %}
        </section>
    </div>
</body>
</html>
